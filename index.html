<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cosmic Colony</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="starfield"></div>

    <header id="topBar">

        <div id="gameInfo">

            <div class="resource">
                <span>Fe</span>
                <span id="feCount">0</span>
            </div>

            <div class="resource">
                <span>Cu</span>
                <span id="cuCount">0</span>
            </div>

            <div class="resource">
                <span>Au</span>
                <span id="auCount">0</span>
            </div>

            <div class="resource">
                <span>Ti</span>
                <span id="tiCount">0</span>
            </div>

            <div class="resource">
                <span>Al</span>
                <span id="alCount">0</span>
            </div>

        </div>

        <div id="phasePanel">

            <div id="dayDisplay">
                DAY 1
            </div>

            <div id="phaseDisplay">
                ☀ DAY
            </div>

        </div>

    </header>

    <main>

        <div id="boardContainer">

            <div id="board"></div>

        </div>

    </main>

    <div id="floatingTextLayer"></div>

    <script src="script.js"></script>

</body>
</html>
