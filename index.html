<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cosmic Match Survival</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at 20% 20%, #334 0%, transparent 30%),
    radial-gradient(circle at 80% 30%, #224 0%, transparent 30%),
    radial-gradient(circle at 50% 80%, #113 0%, transparent 40%),
    linear-gradient(#030314,#08082b);
    color:white;
}

#ui{
    height:90px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    border-bottom:2px solid rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    background:rgba(0,0,0,.2);
}

.stat{
    text-align:center;
}

#phase{
    font-size:28px;
    font-weight:bold;
}

#game{
    height:calc(100vh - 90px);
    display:flex;
    justify-content:center;
    align-items:center;
}

#board{
    width:min(85vw,85vh);
    height:min(85vw,85vh);
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    gap:5px;
}

.cell{
    border-radius:20%;
    cursor:pointer;
    transition:.15s;
    border:2px solid rgba(255,255,255,.15);
}

.cell:hover{
    transform:scale(1.08);
}

.selected{
    outline:4px solid white;
}

.day-circle{
    background:#70d8ff;
}
.day-square{
    background:#71ff95;
}
.day-triangle{
    background:#ffdd68;
}
.day-diamond{
    background:#d67aff;
}

.night-sword{
    background:#ff6464;
}
.night-shield{
    background:#64a3ff;
}
.night-skull{
    background:#888;
}
.night-fire{
    background:#ff9a3c;
}

button{
    padding:10px 18px;
    background:#222f80;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="ui">
    <div class="stat">
        <div>Food</div>
        <div id="food">0</div>
    </div>

    <div class="stat">
        <div>Wood</div>
        <div id="wood">0</div>
    </div>

    <div id="phase">☀️ DAY</div>

    <div class="stat">
        <div>Swords</div>
        <div id="swords">0</div>
    </div>

    <div class="stat">
        <div>Shields</div>
        <div id="shields">0</div>
    </div>

    <button id="toggle">Toggle Day/Night</button>
</div>

<div id="game">
    <div id="board"></div>
</div>

<script>

const SIZE = 8;

let phase = "day";

let food=0;
let wood=0;

let swords=0;
let shields=0;
let monsters=0;

const boardElement = document.getElementById("board");

let board=[];
let selected=null;

function getTypes(){

    if(phase==="day"){
        return [
            "circle",
            "square",
            "triangle",
            "diamond"
        ];
    }

    return [
        "sword",
        "shield",
        "skull",
        "fire"
    ];
}

function randomType(){
    const types=getTypes();
    return types[Math.floor(Math.random()*types.length)];
}

function createBoard(){

    board=[];

    for(let y=0;y<SIZE;y++){
        let row=[];

        for(let x=0;x<SIZE;x++){
            row.push(randomType());
        }

        board.push(row);
    }

    draw();
}

function draw(){

    boardElement.innerHTML="";

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            const cell=document.createElement("div");

            cell.className="cell";

            if(phase==="day"){
                cell.classList.add("day-"+board[y][x]);
            }else{
                cell.classList.add("night-"+board[y][x]);
            }

            if(selected &&
               selected.x===x &&
               selected.y===y){
                cell.classList.add("selected");
            }

            cell.onclick=()=>clickCell(x,y);

            boardElement.appendChild(cell);
        }
    }

    updateUI();
}

function clickCell(x,y){

    if(!selected){
        selected={x,y};
        draw();
        return;
    }

    const dx=Math.abs(selected.x-x);
    const dy=Math.abs(selected.y-y);

    if(dx+dy===1){

        swap(
            selected.x,
            selected.y,
            x,
            y
        );

        processMatches();
    }

    selected=null;
    draw();
}

function swap(x1,y1,x2,y2){

    const temp=board[y1][x1];
    board[y1][x1]=board[y2][x2];
    board[y2][x2]=temp;
}

function processMatches(){

    let matched=[];

    for(let y=0;y<SIZE;y++){

        let count=1;

        for(let x=1;x<SIZE;x++){

            if(board[y][x]===board[y][x-1]){
                count++;
            }else{

                if(count>=3){
                    for(let i=0;i<count;i++){
                        matched.push([x-1-i,y]);
                    }
                }

                count=1;
            }
        }

        if(count>=3){
            for(let i=0;i<count;i++){
                matched.push([SIZE-1-i,y]);
            }
        }
    }

    for(let x=0;x<SIZE;x++){

        let count=1;

        for(let y=1;y<SIZE;y++){

            if(board[y][x]===board[y-1][x]){
                count++;
            }else{

                if(count>=3){
                    for(let i=0;i<count;i++){
                        matched.push([x,y-1-i]);
                    }
                }

                count=1;
            }
        }

        if(count>=3){
            for(let i=0;i<count;i++){
                matched.push([x,SIZE-1-i]);
            }
        }
    }

    if(!matched.length) return;

    matched.forEach(([x,y])=>{

        const type=board[y][x];

        if(phase==="day"){

            if(type==="circle") food++;
            if(type==="square") wood++;
            if(type==="triangle") wood+=2;
            if(type==="diamond") food+=2;

        }else{

            if(type==="sword") swords++;
            if(type==="shield") shields++;
            if(type==="skull") monsters++;
            if(type==="fire") swords+=2;

        }

        board[y][x]=null;
    });

    collapseBoard();
    draw();

    setTimeout(processMatches,150);
}

function collapseBoard(){

    for(let x=0;x<SIZE;x++){

        let column=[];

        for(let y=SIZE-1;y>=0;y--){

            if(board[y][x]!==null){
                column.push(board[y][x]);
            }
        }

        for(let y=SIZE-1;y>=0;y--){

            if(column.length){
                board[y][x]=column.shift();
            }else{
                board[y][x]=randomType();
            }
        }
    }
}

function updateUI(){

    document.getElementById("food").textContent=food;
    document.getElementById("wood").textContent=wood;
    document.getElementById("swords").textContent=swords;
    document.getElementById("shields").textContent=shields;

    document.getElementById("phase").textContent =
        phase==="day"
        ? "☀️ DAY"
        : "🌙 NIGHT";
}

document.getElementById("toggle").onclick=()=>{

    if(phase==="day"){

        phase="night";

        alert(
            "Night falls!\n\n" +
            "Match swords and shields.\n" +
            "Skulls summon monsters."
        );

    }else{

        alert(
            "Monsters: "+monsters+
            "\nSwords: "+swords+
            "\nShields: "+shields
        );

        monsters=0;
        swords=0;
        shields=0;

        phase="day";
    }

    createBoard();
};

createBoard();

</script>
</body>
</html>
