<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Colony</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stars"></div>

<header id="topBar">

    <div class="panel">
        <div class="label">DAY</div>
        <div id="dayCount">1</div>
    </div>

    <div class="panel">
        <div class="label">PHASE</div>
        <div id="phase">DAY ☀</div>
    </div>

    <div class="panel">
        <div class="label">FOOD</div>
        <div id="food">0</div>
    </div>

    <div class="panel">
        <div class="label">CRYSTAL</div>
        <div id="crystal">0</div>
    </div>

    <div class="panel">
        <button id="phaseBtn">TOGGLE</button>
    </div>

</header>

<main>
    <div id="board"></div>
</main>

    
<script src="script.js"></script>

</body>
</html>
